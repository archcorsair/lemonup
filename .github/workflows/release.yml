name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p lemonup-app -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            asset_name: lemonup-linux-x64
          - os: windows-latest
            label: windows-x64
            asset_name: lemonup-windows-x64.exe
          - os: macos-13
            label: macos-x64
            asset_name: lemonup-macos-x64
          - os: macos-14
            label: macos-arm64
            asset_name: lemonup-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p lemonup-app --bin lemonup

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $binary = if ($env:RUNNER_OS -eq 'Windows') { 'target/release/lemonup.exe' } else { 'target/release/lemonup' }
          Copy-Item -LiteralPath $binary -Destination (Join-Path 'dist' '${{ matrix.asset_name }}') -Force

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
          generate_release_notes: true
